worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # Buyuk dosya ve video yuklemeleri icin limit (500 MB)
    client_max_body_size 500M;

    # Gzip sikistirma ile ag trafigini rahatlatma
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        # Disaridan gelen tum istekleri 3000 portundan kabul eder
        listen       3000;
        server_name  localhost;

        # 1. DOSYALAR & MEDYALAR: Python'a hic ugramadan dogrudan sabit diskten son hiz sunulur
        location /uploads/ {
            alias C:/talknex_uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            sendfile on;
            sendfile_max_chunk 1m;
            tcp_nopush on;
        }

        # 2. WEBSOCKET (SOCKET.IO) VE API ISTEKLERI: Arka plandaki FastAPI + Uvicorn'a proxylenir
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;

            # WebSocket Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Istemci IP ve Host Bilgileri
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Zaman asimi degerleri (WebSocket kopmalarini onlemek icin)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}

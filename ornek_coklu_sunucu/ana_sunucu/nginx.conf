worker_processes  auto;

events {
    worker_connections  8192;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # 500 MB dosya/video yükleme limiti
    client_max_body_size 500M;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ==============================================================================
    # 4 ADET GO BACKEND SUNUCUSU ARASINDA YÜK DAĞITIMI (LOAD BALANCING)
    # ==============================================================================
    upstream talknex_cluster {
        # WebSocket oturumlarının ve istemci durumunun kopmaması için ip_hash kullanılır.
        # Aynı kullanıcı her zaman aynı sunucuya bağlanır; o sunucu çökerse otomatik diğerine geçer.
        ip_hash;

        # 1. Ana Sunucu (Kendi üzerindeki Go Backend)
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;

        # 2. Ek Sunucu (Kendi IP adresinizi yazın)
        server 192.168.1.102:3001 max_fails=3 fail_timeout=10s;

        # 3. Ek Sunucu (Kendi IP adresinizi yazın)
        server 192.168.1.103:3001 max_fails=3 fail_timeout=10s;

        # 4. Ek Sunucu (Kendi IP adresinizi yazın)
        server 192.168.1.104:3001 max_fails=3 fail_timeout=10s;

        keepalive 64;
    }

    server {
        # Kullanıcıların bağlandığı ana port (Mobil uygulama buraya bağlanır)
        listen       3000;
        server_name  localhost;

        # 1. YEREL MEDYALAR (S3 kullanılmıyorsa yerel diskten ultra hızlı sunum)
        location /uploads/ {
            alias C:/talknex_uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            sendfile on;
            sendfile_max_chunk 1m;
            tcp_nopush on;
        }

        # 2. TÜM WEBSOCKET & REST API İSTEKLERİ -> 4 SUNUCUYA DAĞITILIR
        location / {
            proxy_pass http://talknex_cluster;
            proxy_http_version 1.1;

            # WebSocket Header Tanımları
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # İstemci IP ve Host Bilgileri ($http_host port bilgisini korur)
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Host $http_host;

            # Kesintisiz canlı bağlantı için zaman aşımı koruması
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}

# Talknex Nginx Linux Configuration
# Konum: /etc/nginx/sites-available/talknex (ve /etc/nginx/sites-enabled/talknex)

server {
    listen 3000;
    server_name _;

    client_max_body_size 500M;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. Medya ve Videolar (Disk üzerinden anında Python'a yük binmeden)
    location /uploads/ {
        alias /var/www/talknex/server_python/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
    }

    # 2. WebSocket & REST API
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
